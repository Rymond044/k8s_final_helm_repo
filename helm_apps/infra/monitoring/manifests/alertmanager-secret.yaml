apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-telegram-config
  namespace: monitoring
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'telegram-bot'
    receivers:
      - name: 'telegram-bot'
        telegram_configs:
          - bot_token: 'telegram_bot_token'
            chat_id: -5302962541
            send_resolved: true
            parse_mode: 'HTML'
            message: |
              <b>{{ if eq .Status "firing" }}🔥 ALERT FIRING{{ else }}✅ ALERT RESOLVED{{ end }}</b>
              <b>Alert:</b> {{ .CommonAnnotations.summary }}
              <b>Description:</b> {{ .CommonAnnotations.description }}
              <b>Severity:</b> {{ .CommonLabels.severity }}
