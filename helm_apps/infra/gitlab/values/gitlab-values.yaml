nginx-ingress:
  enabled: false

global:
  hosts:
    domain: minikube.local
    externalIP: 192.168.49.2
  ingress:
    enabled: true
    configureCertmanager: false
    class: nginx
    provider: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
    tls:
      enabled: false

  kas:
    enabled: false

  appConfig:
    object_store:
      enabled: true
      connection:
        secret: gitlab-minio-secret
        key: connection
      storage_options:
        server_side_encryption: false
      bucket_prefix: ""
      objects:
        artifacts:
          bucket: gitlab-storage
        lfs:
          bucket: gitlab-storage
        uploads:
          bucket: gitlab-storage
        packages:
          bucket: gitlab-storage

  psql:
    host: gitlab-postgres-postgresql.gitlab.svc.cluster.local
    port: 5432
    username: gitlab
    database: gitlabhq_production
    password:
      secret: gitlab-postgres-password
      key: mainDB-password

  redis:
    host: gitlab-redis-master.gitlab.svc.cluster.local
    port: 6379
    auth:
      secret: gitlab-redis-password
      key: secret

gitlab:
  webservice:
    minReplicas: 1
    maxReplicas: 1
    workerProcesses: 0
    resources:
      requests:
        cpu: 100m
        memory: 1200Mi
      limits:
        memory: 2000Mi
  sidekiq:
    minReplicas: 1
    maxReplicas: 1
    concurrency: 2
    resources:
      requests:
        cpu: 250m
        memory: 500Mi
      limits:
        memory: 1800Mi
  gitlab-shell:
    minReplicas: 1
    maxReplicas: 1
  kas:
    enabled: false
  gitaly:
    extraInitContainers: |
      - name: minikube-volume-chown
        image: busybox:latest
        command:
          - sh
          - -c
          - "chown -R 1000:1000 /home/git/repositories && chmod 700 /home/git/repositories"
        securityContext:
          runAsUser: 0
        volumeMounts:
          - name: repo-data
            mountPath: /home/git/repositories
    persistence:
      enabled: true
      size: 5Gi
      storageClass: "standard"

registry:
  enabled: true
  hpa:
    minReplicas: 1
    maxReplicas: 1
  storage:
    secret: gitlab-registry-storage
    key: config

gitlab-runner:
  enabled: true
  gitlabUrl: http://gitlab-webservice-default.gitlab.svc.cluster.local:8080
  concurrent: 10
  checkInterval: 3
  runners:
    privileged: true
    config: |
      [[runners]]
        name = "kubernetes-runner"
        executor = "kubernetes"
        request_concurrency = 4
        
        [runners.custom_build_dir]
        
        [runners.cache]
          MaxUploadedArchiveSize = 0
          
        [runners.kubernetes]
          host = ""
          bearer_token_overwrite_allowed = false
          image = "docker:24.0.7"
          privileged = true
          namespace = "gitlab"
          env = [
            "DOCKER_TLS_CERTDIR=", 
            "DOCKER_DRIVER=overlay2"
          ]

prometheus:
  install: false
gitlab-exporter:
  enabled: false
certmanager-issuer:
  email: elisey.rymant@innowise.com
