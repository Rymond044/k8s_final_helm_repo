apiVersion: v1
kind: Secret
metadata:
  name: gitlab-postgres-password
  namespace: gitlab
type: Opaque
stringData:
  mainDB-password: "gitlab-password"

---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-redis-password
  namespace: gitlab
type: Opaque
stringData:
  secret: "redis-password"

---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-minio-secret
  namespace: gitlab
type: Opaque
stringData:
  connection: |
    provider: AWS
    region: us-east-1
    aws_access_key_id: minioadmin
    aws_secret_access_key: minioadminpassword
    host: minio.gitlab.svc.cluster.local
    port: 9000
    use_iam_profile: false
    aws_signature_version: 4
    endpoint: http://minio.gitlab.svc.cluster.local:9000
    path_style: true

---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-registry-storage
  namespace: gitlab
type: Opaque
stringData:
  config: |
    s3:
      accesskey: minioadmin
      secretkey: minioadminpassword
      bucket: registry-storage
      region: us-east-1
      regionendpoint: http://minio.gitlab.svc.cluster.local:9000
      v4auth: true
      secure: false
      pathstyle: true
