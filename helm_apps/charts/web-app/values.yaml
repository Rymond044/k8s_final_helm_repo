registry:
  username: "gitlab+deploy-token-1"
  password: ""

image:
  repository: registry.minikube.local/rymond044/final_k8s_app_repo
  tag: "dev-v2.3.0"
  pullPolicy: IfNotPresent

secret:
  appSecretValue: ""

resources:
